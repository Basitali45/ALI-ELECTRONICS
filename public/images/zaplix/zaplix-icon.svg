<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <linearGradient id="topWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="midDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bottomWing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Stylized Geometric Z Icon -->
  <g filter="url(#glow)">
    <!-- Top Horizontal & Arrow Cut -->
    <path d="M28 32 C28 29.5 30 27.5 32.5 27.5 L93 27.5 C97 27.5 99.5 32 97 35.5 L78 61 L54 61 L70 39 L35 39 C31.5 39 28 35.5 28 32 Z" fill="url(#topWing)" />
    
    <!-- Central Dynamic Delivery Wedge / Diagonal -->
    <path d="M78 55 L98 29 C100 26.5 98.5 24 95.5 24 L56 24 C52 24 50 28 53 31.5 L73 57 Z" fill="#00F0FF" opacity="0.3" />
    <path d="M47 52 L83 52 L50 94 C48 96.5 44 96 43 93 L47 52 Z" fill="url(#midDiagonal)" opacity="0.85" />

    <!-- Bottom Horizontal Forward Bar -->
    <path d="M35 100.5 C31 100.5 28.5 96 31 92.5 L50 67 L74 67 L58 89 L93 89 C96.5 89 100 92.5 100 96 C100 98.5 98 100.5 95.5 100.5 L35 100.5 Z" fill="url(#bottomWing)" />

    <!-- Forward Delivery Spark Node -->
    <polygon points="98,90 106,95 98,100 100,95" fill="#00F0FF" />
    <circle cx="95" cy="33" r="3.5" fill="#00F0FF" />
  </g>
</svg>
